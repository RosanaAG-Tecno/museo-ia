<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clasificador de piezas (Teachable Machine)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    body{font-family:system-ui,Arial,sans-serif;margin:20px}
    button{padding:10px 14px;margin:6px}
    #label-container div{margin:4px 0}
    #status{opacity:.7}
    img{max-width:320px;display:none;margin-top:10px}
  </style>
</head>
<body>
  <h1>Clasificador de piezas (Teachable Machine)</h1>
  <p id="status">Listo. Primero pulsa “Cargar modelo”.</p>

  <div>
    <button onclick="init()">Cargar modelo</button>
    <button onclick="document.getElementById('file').click()">Elegir archivo</button>
    <input id="file" type="file" accept="image/*" style="display:none" onchange="predictFromFile(event)">
    <button onclick="initWebcam()">Usar cámara</button>
  </div>

  <img id="img" alt="Vista previa">
  <div id="webcam-container" style="margin-top:10px"></div>
  <h3>Resultados</h3>
  <div id="label-container"></div>

  <script>
    // TU MODELO (nuevo)
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/Szu6OpDzw/";
    let model, webcam, labels;

    function setStatus(t){ document.getElementById("status").textContent = t; }

    async function init(){
      try{
        setStatus("Cargando modelo…");
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        const total = model.getTotalClasses();
        labels = document.getElementById("label-container");
        labels.innerHTML = "";
        for (let i=0;i<total;i++) labels.appendChild(document.createElement("div"));
        setStatus("✅ Modelo cargado");
        alert("✅ Modelo cargado correctamente");
      }catch(e){
        console.error(e);
        setStatus("❌ Error al cargar el modelo");
        alert("❌ No se pudo cargar el modelo. Revisa la URL.");
      }
    }

    async function initWebcam(){
      if(!model){ alert("Primero carga el modelo"); return; }
      const flip = true;
      webcam = new tmImage.Webcam(320, 320, flip);
      await webcam.setup();
      await webcam.play();
      document.getElementById("webcam-container").innerHTML = "";
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      window.requestAnimationFrame(loop);
    }

    async function loop(){
      webcam.update();
      await predict(webcam.canvas);
      window.requestAnimationFrame(loop);
    }

    async function predictFromFile(ev){
      if(!model){ alert("Primero carga el modelo"); return; }
      const img = document.getElementById("img");
      img.src = (window.URL||window.webkitURL).createObjectURL(ev.target.files[0]);
      img.style.display = "block";
      img.onload = ()=>predict(img);
    }

    async function predict(input){
      const res = await model.predict(input, false); // [{className, probability}, ...]
      res.sort((a,b)=>b.probability-a.probability);
      for(let i=0;i<res.length;i++){
        labels.childNodes[i].textContent =
          `${res[i].className}: ${(res[i].probability*100).toFixed(2)}%`;
      }
    }
  </script>
</body>
</html>

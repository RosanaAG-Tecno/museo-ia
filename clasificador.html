<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clasificador de piezas (Teachable Machine)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <style>
    :root{--fg:#222;--muted:#666;--ok:#17a24b}
    body{font-family:system-ui,Arial,sans-serif;margin:20px;color:var(--fg)}
    h1{margin:0 0 8px}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
    button{padding:10px 14px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
    button:hover{background:#f5f5f5}
    #status{display:flex;align-items:center;gap:8px;color:var(--muted);margin:6px 0 10px}
    #status.ok{color:var(--ok)}
    .dot{width:14px;height:14px;border-radius:50%;background:#ccc}
    .ok .dot{background:var(--ok)}
    #img{max-width:340px;display:none;margin-top:8px;border-radius:6px}
    #label-container div{margin:4px 0}
    .panel{margin-top:12px}
  </style>
</head>

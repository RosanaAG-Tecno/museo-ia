<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clasificador de piezas (Teachable Machine)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    #webcam-container, #image-preview { margin-top: 20px; }
    #label-container div { margin: 5px 0; }
    button { margin: 5px; padding: 10px; }
  </style>
</head>
<body>
  <h1>Clasificador de piezas (Teachable Machine)</h1>
  <p>Este visor carga el modelo entrenado en Teachable Machine y devuelve las probabilidades.</p>

  <button type="button" onclick="init()">Cargar modelo</button>
  <input id="fileInput" type="file" accept="image/*" onchange="predictFromFile(event)">
  <button type="button" onclick="initWebcam()">Usar cámara</button>

  <div id="webcam-container"></div>
  <img id="image-preview" width="300" style="display:none;">
  <div id="label-container"></div>

  <script>
    // Carpeta correcta de tu modelo en GitHub
    const MODEL_URL = "https://rosanaag-tecno.github.io/museo-ia/model/";
    let model, webcam, labelContainer, maxPredictions;

    async function init() {
      try {
        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          labelContainer.appendChild(document.createElement("div"));
        }
        alert("✅ Modelo cargado correctamente");
      } catch (e) {
        console.error("Error cargando modelo:", e);
        alert("❌ Error al cargar el modelo. Revisa que existan model.json, metadata.json y weights.bin en /model/");
      }
    }

    async function initWebcam() {
      if (!model) { alert("Primero carga el modelo"); return; }
      const flip = true;
      webcam = new tmImage.Webcam(300, 300, flip);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      const cont = document.getElementById("webcam-container");
      cont.innerHTML = "";
      cont.appendChild(webcam.canvas);
    }

    async function loop() {
      webcam.update();
      await predict(webcam.canvas);
      window.requestAnimationFrame(loop);
    }

    async function predictFromFile(event) {
      if (!model) { alert("Primero carga el modelo"); return; }
      const image = document.getElementById("image-preview");
      image.src = (window.URL || window.webkitURL).createObjectURL(event.target.files[0]);
      image.style.display = "block";
      image.onload = async () => { await predict(image); };
    }

    async function predict(input) {
      const preds = await model.predict(input, false);
      for (let i = 0; i < preds.length; i++) {
        labelContainer.childNodes[i].innerHTML =
          `${preds[i].className}: ${(preds[i].probability * 100).toFixed(2)}%`;
      }
    }
  </script>
</body>
</html>

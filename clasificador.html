<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clasificador TM - Museo Mexica</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; padding: 12px; line-height: 1.3; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    img { max-width: 100%; height: auto; border-radius: 10px; }
    .card { border: 1px solid #ccc; border-radius: 12px; padding: 12px; }
    .muted { opacity: .7; font-size: .9rem; }
    button { padding: 10px 14px; border-radius: 10px; border: 1px solid #ccc; background: #f5f5f5; cursor: pointer; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 4px 0; }
    .hidden { display: none; }
    .bar { height: 8px; background: #ddd; border-radius: 6px; overflow: hidden; }
    .fill { height: 100%; background: #999; width: 0; }
    .kq { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  </style>
</head>
<body>
  <h1 style="margin-top:0">Clasificador de piezas (Teachable Machine)</h1>
  <p class="muted">Este visor carga el modelo de Teachable Machine y devuelve las probabilidades.</p>

  <!-- Controles visibles (útiles para depurar en navegador). 
       En App Inventor puedes dispararlos con EvaluateJavaScript('abrirArchivo()' / 'abrirCamara()'). -->
  <div class="row" style="margin-bottom:12px">
    <button onclick="abrirArchivo()">Elegir imagen</button>
    <button onclick="abrirCamara()">Hacer foto</button>
    <span id="estado" class="muted">Cargando modelo…</span>
  </div>

  <div class="row">
    <div class="card" style="flex:1; min-width: 220px;">
      <img id="vista" alt="Vista previa" />
    </div>

    <div class="card" style="flex: 1; min-width: 220px;">
      <h3 style="margin-top:0">Resultados</h3>
      <div id="lista" class="kq"></div>
    </div>
  </div>

  <!-- Inputs ocultos para archivo/cámara -->
  <input id="pick" class="hidden" type="file" accept="image/*" />
  <input id="cam"  class="hidden" type="file" accept="image/*" capture="environment" />

  <script type="module">
    import * as tmImage from "https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.esm.js";

    const URL = "https://teachablemachine.withgoogle.com/models/CvJ9-vGZC/";
    let model, maxPredictions = 0;
    const img = document.getElementById('vista');
    const estado = document.getElementById('estado');
    const lista = document.getElementById('lista');
    const pick = document.getElementById('pick');
    const cam  = document.getElementById('cam');

    async function cargarModelo() {
      try {
        model = await tmImage.load(URL + "model.json", URL + "metadata.json");
        maxPredictions = model.getTotalClasses?.() ?? 0;
        estado.textContent = "Modelo cargado ✔";
      } catch (e) {
        console.error(e);
        estado.textContent = "Error al cargar el modelo";
      }
    }

    function abrirArchivo() { pick.click(); }
    function abrirCamara()  { cam.click();  }
    window.abrirArchivo = abrirArchivo;
    window.abrirCamara  = abrirCamara;

    async function cargarArchivo(file) {
      if (!file) return;
      const url = URL.createObjectURL(file);
      img.src = url;
      try {
        await img.decode?.();
      } catch {}
      predecir(img);
    }

    pick.addEventListener('change', e => cargarArchivo(e.target.files?.[0]));
    cam.addEventListener('change',  e => cargarArchivo(e.target.files?.[0]));

    function pintarResultados(items) {
      // items: [{clase, porcentaje}]
      lista.innerHTML = "";
      items.forEach(it => {
        const name = document.createElement('div');
        name.textContent = it.clase;

        const right = document.createElement('div');
        right.style.minWidth = "70px";
        right.style.textAlign = "right";
        right.textContent = it.porcentaje.toFixed(1) + "%";

        const bar = document.createElement('div'); bar.className = "bar";
        const fill = document.createElement('div'); fill.className = "fill";
        fill.style.width = Math.max(1, Math.round(it.porcentaje)) + "%";
        bar.appendChild(fill);

        lista.appendChild(name);
        lista.appendChild(right);
        lista.appendChild(bar);
      });
    }

    async function predecir(element) {
      if (!model) await cargarModelo();
      if (!model) return;

      estado.textContent = "Clasificando…";
      const preds = await model.predict(element);
      preds.sort((a,b) => b.probability - a.probability);

      const out = preds.map(p => ({
        clase: p.className,
        porcentaje: +(p.probability * 100).toFixed(1)
      }));

      pintarResultados(out);
      estado.textContent = "Listo";

      // Enviar a App Inventor (si existe)
      try {
        if (window.AppInventor?.setWebViewString) {
          window.AppInventor.setWebViewString(JSON.stringify({
            type: "predicciones",
            items: out
          }));
        }
      } catch {}
    }

    // Carga el modelo al iniciar
    cargarModelo();
  </script>
</body>
</html>
